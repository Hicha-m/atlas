name: Prepare visual reference screenshots

on:
  push:
    branches: [main]
    paths:
      - 'e2e/visual.spec.cjs'
      - 'playwright.visual.config.cjs'
      - 'styles.css'
      - 'electricity.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-baselines:
    name: Generate reference screenshots in a separate review branch
    if: github.repository == 'Hicha-m/atlas'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Skip if approved references already exist on main
        id: references
        shell: bash
        run: |
          if find e2e/visual.spec.cjs-snapshots -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.references.outputs.needed == 'true'
        run: npm install --no-audit --no-fund
      - name: Start clean candidate branch from current main
        if: steps.references.outputs.needed == 'true'
        run: |
          git fetch origin '+refs/heads/test/visual-reference-baselines:refs/remotes/origin/test/visual-reference-baselines' || true
          git switch -C test/visual-reference-baselines
      - name: Generate deterministic pixel references
        if: steps.references.outputs.needed == 'true'
        run: npm run test:visual:update
      - name: Push updated reference images for review (not directly to main)
        if: steps.references.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.cjs-snapshots/
          git commit -m "test(visual): regenerate reference captures for current Primer layout"
          git push --force-with-lease origin HEAD:refs/heads/test/visual-reference-baselines
      - name: Save pixel references and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-reference-candidates
          path: |
            e2e/visual.spec.cjs-snapshots/
            test-results/
            playwright-visual-report/
          if-no-files-found: ignore
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          npm run check
          node --check e2e/production.spec.cjs
          node --check e2e/visual.spec.cjs
      - name: Automated tests
        run: node --test tests/*.test.cjs
      - name: HTTP smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ -o /tmp/atlas-index.html; then break; fi
            sleep 1
          done
          grep -q 'app.js' /tmp/atlas-index.html
          curl --fail --silent http://127.0.0.1:8765/app.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/styles.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/weather-immersive.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/weather-immersive-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/weather-immersive.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport-live.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport-live.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport-live-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport-extras.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/transport-marseille-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/api/transport-live.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/api/transport-catalogue.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-world.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-world-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-europe-live-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-world.css -o /dev/null

  browser:
    name: Playwright visual & interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Chromium binaries
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Cache summary
        run: |
          echo '### Browser provisioning' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chromium binary cache hit: ${{ steps.browser-cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Browser tests (PR desktop/mobile, main complete)
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium
            scope="desktop + mobile (PR)"
          else
            npm run test:e2e
            scope="desktop + tablet + mobile (main)"
          fi
          echo "### Functional Playwright" >> "$GITHUB_STEP_SUMMARY"
          echo "- Matrix: $scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: $((SECONDS-start)) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare Primer UI to approved pixel baselines
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          if find e2e/visual.spec.cjs-snapshots -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              npm run test:visual -- --project=desktop-chromium --project=mobile-chromium
            else
              npm run test:visual
            fi
            echo "- Pixel reference comparison: $((SECONDS-start)) seconds" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Pixel baselines pending approval" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-playwright-report
          path: |
            playwright-report/
            playwright-visual-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

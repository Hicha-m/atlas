name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          npm run check
          node --check e2e/production.spec.cjs
          node --check e2e/visual.spec.cjs
          node --check e2e/electricity-global.spec.cjs
      - name: Automated tests
        run: node --test tests/*.test.cjs
      - name: HTTP smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ -o /tmp/atlas-index.html; then break; fi
            sleep 1
          done
          grep -q 'app.js' /tmp/atlas-index.html
          curl --fail --silent http://127.0.0.1:8765/app.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/styles.css -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity-data.js -o /dev/null
          curl --fail --silent http://127.0.0.1:8765/electricity.css -o /dev/null

  browser:
    name: Playwright visual & interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Compare Primer UI to approved pixel baselines
        run: |
          if find e2e/visual.spec.cjs-snapshots -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            npm run test:visual
          else
            echo 'Reference screenshots not approved yet. Baseline review branch will be created after merge.'
          fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-playwright-report
          path: |
            playwright-report/
            playwright-visual-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
